name: Linux Build

on:
  workflow_call:
    inputs:
      use-clang:
        description: Use Clang to compile the project.
        default: false
        required: false
        type: boolean
    secrets:
      CHALK_PRIVATE_GITHUB_ACTIONS_HMAC_KEY:
        required: false

jobs:

  get-changes:
    runs-on: ubuntu-latest
    outputs:
      run-clang-tidy: ${{ steps.changes.outputs.run_clang_tidy }}
      changed-files: ${{ steps.changes.outputs.files}}
      diff-range: ${{ steps.changes.outputs.range }}
      merge-base-commit: ${{ steps.changes.outputs.merge_base_commit }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get changed files
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_TRIGGER: ${{ github.event_name }}
        run: |
          echo "JOB_TRIGGER: $JOB_TRIGGER"
          if [[ "$JOB_TRIGGER" == "pull_request" ]]; then
            merge_base_commit=$(gh api -q '.merge_base_commit.sha' \
              /repos/facebookincubator/velox/compare/facebookincubator:$BASE_REF...$PR_OWNER:$HEAD_REF \
            )

            range="$merge_base_commit..$HEAD_SHA"
            echo "range=$range" >> "$GITHUB_OUTPUT"
            echo "merge_base_commit=$merge_base_commit" >> "$GITHUB_OUTPUT"

            git diff --name-only $range > changed_files.txt

            cpp_files='.+\.(cpp|h|hpp)$'

            {
              echo 'files<<EOF'
              cat changed_files.txt
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"

            if grep -qE $cpp_files changed_files.txt; then
              echo "run_clang_tidy=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run_clang_tidy=false" >> "$GITHUB_OUTPUT"
          fi

  adapters:
    name: Linux release with adapters
    # DISABLED (Chalk CI cost): this job has not completed successfully once
    # since at least 2026-08-01. Over August it and `ubuntu-debug` ran 120 times
    # between them -- via both the "Build with GCC" (linux-build.yml) and
    # "Build with Clang" (scheduled.yml nightly cron) callers -- and every
    # single run ended `cancelled`, averaging 18.8h and piling up at GitHub's
    # hard 24h job ceiling. Nothing in this workflow sets `timeout-minutes`,
    # so there is no earlier backstop.
    #
    # Each run holds an entire google-c4d-standard-16 node, because that
    # runner scale set is request-less (one runner per node), so this cost
    # roughly 2,260 node-hours on Chalk's CI cluster in August for zero green
    # builds. Nothing `needs:` these two jobs, so skipping them is contained.
    #
    # To re-enable: drop the `if: false` AND set a `timeout-minutes` (upstream
    # Velox uses 120 for comparable jobs) so a stall cannot run for a day.
    if: false
    runs-on: google-c4d-standard-16
    container: ghcr.io/facebookincubator/velox-dev:adapters
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CACHE_HMAC_KEY: ${{ secrets.CHALK_PRIVATE_GITHUB_ACTIONS_HMAC_KEY }}
      VELOX_DEPENDENCY_SOURCE: SYSTEM
      cudf_SOURCE: BUNDLED
      CUDA_VERSION: '12.9'
      faiss_SOURCE: BUNDLED
      USE_CLANG: "${{ inputs.use-clang && 'true' || 'false' }}"
    outputs:
      cudf-changes: ${{ steps.changes.outputs.cudf }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Fix git permissions
        # Usually actions/checkout does this but as we run in a container
        # it doesn't work
        run: git config --global --add safe.directory ${GITHUB_WORKSPACE}

      - name: Install Dependencies
        env:
          VELOX_BUILD_SHARED: "ON"
          VELOX_ARROW_CMAKE_PATCH: ${{ github.workspace }}/CMake/resolve_dependency_modules/arrow/cmake-compatibility.patch
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q "scripts/setup-"; then
            echo "Removing previous AWS SDK and s2n installations to avoid conflicts..."
            rm -rf /usr/local/include/s2n /usr/local/lib64/s2n
            rm -rf /usr/local/include/aws
            # Overwrite old setup scripts with changed versions
            cp scripts/setup-* /

            mkdir /tmp/build
            cd /tmp/build
            source /opt/rh/gcc-toolset-12/enable
            # Install basic deps with GCC. Some deps have problems (e.g. folly missing atomic lib).
            USE_CLANG=false bash /setup-centos9.sh

            bash /setup-centos-adapters.sh

            cd /
            rm -rf /tmp/build # cleanup to avoid issues with disk space
          fi

      - name: Restore ccache
        if: ${{ env.CACHE_HMAC_KEY != '' }}
        id: restore-ccache-adapters-head
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          endpoint: storage.googleapis.com
          bucket: "chalk-ci-binary-cache"
          accessKey: GOOG1ETWJ2DR5ODUAGEWQCI63XMPOCMVUOR5VWS6QYVA4QSCV3QZB3XRP3DLQ
          secretKey: ${{ env.CACHE_HMAC_KEY }}
          use-fallback: false
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-adapters-${{ inputs.use-clang && 'clang' || 'gcc' }}-${{ github.ref_name }}

      - name: Restore ccache (base fallback)
        if: ${{ env.CACHE_HMAC_KEY != '' && github.base_ref != '' && steps.restore-ccache-adapters-head.outputs.cache-hit != 'true' }}
        id: restore-ccache-adapters-base
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          endpoint: storage.googleapis.com
          bucket: "chalk-ci-binary-cache"
          accessKey: GOOG1ETWJ2DR5ODUAGEWQCI63XMPOCMVUOR5VWS6QYVA4QSCV3QZB3XRP3DLQ
          secretKey: ${{ env.CACHE_HMAC_KEY }}
          use-fallback: false
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-adapters-${{ inputs.use-clang && 'clang' || 'gcc' }}-${{ github.base_ref }}

      - name: Zero Ccache Statistics
        run: |
          ccache -sz

      - name: Make Release Build
        env:
          MAKEFLAGS: NUM_THREADS=16 MAX_HIGH_MEM_JOBS=8 MAX_LINK_JOBS=8
          CUDA_ARCHITECTURES: 70
          CUDA_COMPILER: /usr/local/cuda-${CUDA_VERSION}/bin/nvcc
          # Set compiler to GCC 14
          CUDA_FLAGS: -ccbin /opt/rh/gcc-toolset-14/root/usr/bin
        run: |
          EXTRA_CMAKE_FLAGS=(
            "-DVELOX_ENABLE_BENCHMARKS=ON"
            "-DVELOX_ENABLE_EXAMPLES=ON"
            "-DVELOX_ENABLE_ARROW=ON"
            "-DVELOX_ENABLE_GEO=ON"
            "-DVELOX_ENABLE_PARQUET=ON"
            "-DVELOX_ENABLE_HTTP=ON"
            "-DVELOX_ENABLE_HDFS=ON"
            "-DVELOX_ENABLE_S3=ON"
            "-DVELOX_ENABLE_GCS=ON"
            "-DVELOX_ENABLE_ABFS=ON"
            "-DVELOX_ENABLE_WAVE=ON"
            "-DVELOX_MONO_LIBRARY=ON"
          )
          if [[ "${USE_CLANG}" = "true" ]]; then
             scripts/setup-centos9.sh install_clang15; export CC=/usr/bin/clang-15; export CXX=/usr/bin/clang++-15; CUDA_FLAGS="-ccbin /usr/lib64/llvm15/bin/clang++-15";
          else
            # cuDF (unsupported for Clang) and Faiss (link issue when using Clang)
            # are excluded for Clang compilation and need to be added back when using GCC.
            EXTRA_CMAKE_FLAGS+=("-DVELOX_ENABLE_CUDF=ON")
            EXTRA_CMAKE_FLAGS+=("-DVELOX_ENABLE_FAISS=ON")
            # Investigate issues with remote function service: Issue #13897
            EXTRA_CMAKE_FLAGS+=("-DVELOX_ENABLE_REMOTE_FUNCTIONS=ON")
          fi
          source /opt/rh/gcc-toolset-14/enable
          g++ --version
          # CC/CXX are set to GCC12 in the adapters image build and it needs to be overridden
          # after sourcing GCC14.
          CC=gcc CXX=g++ make release EXTRA_CMAKE_FLAGS="${EXTRA_CMAKE_FLAGS[*]}"

      - name: Ccache after
        run: ccache -s

      - name: Save ccache
        if: ${{ always() && env.CACHE_HMAC_KEY != '' && steps.restore-ccache-adapters-head.outputs.cache-hit != 'true' && steps.restore-ccache-adapters-base.outputs.cache-hit != 'true' }}
        uses: tespkg/actions-cache/save@v1.9.0
        with:
          endpoint: storage.googleapis.com
          bucket: "chalk-ci-binary-cache"
          accessKey: GOOG1ETWJ2DR5ODUAGEWQCI63XMPOCMVUOR5VWS6QYVA4QSCV3QZB3XRP3DLQ
          secretKey: ${{ env.CACHE_HMAC_KEY }}
          use-fallback: false
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-adapters-${{ inputs.use-clang && 'clang' || 'gcc' }}-${{ github.ref_name }}

      - name: Run Tests
        env:
          LIBHDFS3_CONF: ${{ github.workspace }}/scripts/ci/hdfs-client.xml
        working-directory: _build/release
        run: |
          source /setup-classpath.sh
          ulimit -n 65536
          ctest -j 24 --timeout 900 --label-exclude cuda_driver --output-on-failure --no-tests=error

          export CLASSPATH=`/usr/local/hadoop/bin/hdfs classpath --glob`
          ctest -j 16 --label-exclude cuda_driver --output-on-failure --no-tests=error

  ubuntu-debug:
    runs-on: google-c4d-standard-16
    name: Ubuntu debug with resolve_dependency
    # DISABLED (Chalk CI cost): this job has not completed successfully once
    # since at least 2026-08-01. Over August it and `adapters` ran 120 times
    # between them -- via both the "Build with GCC" (linux-build.yml) and
    # "Build with Clang" (scheduled.yml nightly cron) callers -- and every
    # single run ended `cancelled`, averaging 18.8h and piling up at GitHub's
    # hard 24h job ceiling. Nothing in this workflow sets `timeout-minutes`,
    # so there is no earlier backstop.
    #
    # Each run holds an entire google-c4d-standard-16 node, because that
    # runner scale set is request-less (one runner per node), so this cost
    # roughly 2,260 node-hours on Chalk's CI cluster in August for zero green
    # builds. Nothing `needs:` these two jobs, so skipping them is contained.
    #
    # To re-enable: drop the `if: false` AND set a `timeout-minutes` (upstream
    # Velox uses 120 for comparable jobs) so a stall cannot run for a day.
    if: false
    env:
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CACHE_HMAC_KEY: ${{ secrets.CHALK_PRIVATE_GITHUB_ACTIONS_HMAC_KEY }}
      USE_CLANG: ${{ inputs.use-clang && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: velox
    steps:
      - name: Restore ccache
        if: ${{ env.CACHE_HMAC_KEY != '' }}
        id: restore-ccache-debug-head
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          endpoint: storage.googleapis.com
          bucket: "chalk-ci-binary-cache"
          accessKey: GOOG1ETWJ2DR5ODUAGEWQCI63XMPOCMVUOR5VWS6QYVA4QSCV3QZB3XRP3DLQ
          secretKey: ${{ env.CACHE_HMAC_KEY }}
          use-fallback: false
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-debug-default-${{ inputs.use-clang && 'clang' || 'gcc' }}-${{ github.ref_name }}

      - name: Restore ccache (base fallback)
        if: ${{ env.CACHE_HMAC_KEY != '' && github.base_ref != '' && steps.restore-ccache-debug-head.outputs.cache-hit != 'true' }}
        id: restore-ccache-debug-base
        uses: tespkg/actions-cache/restore@v1.9.0
        with:
          endpoint: storage.googleapis.com
          bucket: "chalk-ci-binary-cache"
          accessKey: GOOG1ETWJ2DR5ODUAGEWQCI63XMPOCMVUOR5VWS6QYVA4QSCV3QZB3XRP3DLQ
          secretKey: ${{ env.CACHE_HMAC_KEY }}
          use-fallback: false
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-debug-default-${{ inputs.use-clang && 'clang' || 'gcc' }}-${{ github.base_ref }}

      - name: Ensure Cache Dirs Exists
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$CCACHE_DIR"

      - name: Clear CCache Statistics
        run: |
          ccache -sz

      - name: Make Debug Build
        env:
          VELOX_DEPENDENCY_SOURCE: SYSTEM
          ICU_SOURCE: SYSTEM
          MAKEFLAGS: NUM_THREADS=16 MAX_HIGH_MEM_JOBS=8 MAX_LINK_JOBS=8
        run: |
          EXTRA_CMAKE_FLAGS=(
            "-DCMAKE_LINK_LIBRARIES_STRATEGY=REORDER_FREELY"
            "-DVELOX_BUILD_SHARED=ON"
            "-DVELOX_ENABLE_BENCHMARKS=ON"
            "-DVELOX_ENABLE_EXAMPLES=ON"
            "-DVELOX_ENABLE_ARROW=ON"
            "-DVELOX_ENABLE_GEO=ON"
            "-DVELOX_ENABLE_PARQUET=ON"
            "-DVELOX_MONO_LIBRARY=ON"
          )
          if [[ "${USE_CLANG}" = "true" ]]; then
             export CC=/usr/bin/clang-15; export CXX=/usr/bin/clang++-15;
          else
            EXTRA_CMAKE_FLAGS+=("-DVELOX_ENABLE_FAISS=ON")
            EXTRA_CMAKE_FLAGS+=("-DVELOX_ENABLE_REMOTE_FUNCTIONS=ON")
          fi
          make debug

      - name: CCache after
        run: |
          ccache -vs

      - name: Save ccache
        if: ${{ always() && env.CACHE_HMAC_KEY != '' && steps.restore-ccache-debug-head.outputs.cache-hit != 'true' && steps.restore-ccache-debug-base.outputs.cache-hit != 'true' }}
        uses: tespkg/actions-cache/save@v1.9.0
        with:
          endpoint: storage.googleapis.com
          bucket: "chalk-ci-binary-cache"
          accessKey: GOOG1ETWJ2DR5ODUAGEWQCI63XMPOCMVUOR5VWS6QYVA4QSCV3QZB3XRP3DLQ
          secretKey: ${{ env.CACHE_HMAC_KEY }}
          use-fallback: false
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-debug-default-${{ inputs.use-clang && 'clang' || 'gcc' }}-${{ github.ref_name }}

      - name: Run Tests
        run: |
          cd _build/debug && ctest -j 16 --output-on-failure --no-tests=error
