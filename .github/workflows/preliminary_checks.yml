name: Run Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Chalk: `4-core-ubuntu` is a GitHub larger-runner label configured in
  # upstream's org but not served for this fork, so jobs targeting it never get
  # a runner and queue to GitHub's hard 24h ceiling. Run pre-commit on a
  # standard hosted runner instead; the hooks are cheap and finish in minutes.
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  title-check:
    # Still guarded: this fork's PR titles follow a different convention
    # (`[velox] feat: ...`), which upstream's regex rejects. Enabling it would
    # fail nearly every PR here. See the runner note on `pre-commit` above.
    if: ${{ github.repository == 'facebookincubator/velox' }}
    name: PR Title Format
    runs-on: 4-core-ubuntu
    steps:
      - shell: python
        env:
          title: "${{ github.event.pull_request.title }}"
        run: |
          import re
          import os
          title = os.environ["title"]
          title_re = r"^(feat|fix|perf|build|test|docs|refactor|misc)(\(.+\))?!?: ([A-Z].+)[^.]$"
          match = re.search(title_re, title)

          if match is None:
            print("::error::Please follow conventional commit guidelines in commit titles as described in CONTRIBUTING.md: https://github.com/facebookincubator/velox/blob/main/CONTRIBUTING.md#commit-messages")
            exit(1)
          else:
            exit(0)
